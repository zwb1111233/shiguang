<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拾光 · 每日心情手账</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wallpaper" id="wallpaperLayer" aria-hidden="true"></div>
<div class="scrim" id="scrimLayer" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/home"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 64 64" fill="currentColor"><path d="M31 13c1.9 9.8 6.9 14.8 16.5 16.5C37.9 31.2 32.9 36.2 31 46c-1.9-9.8-6.9-14.8-16.5-16.5C24.1 27.8 29.1 22.8 31 13z"/><circle cx="46.5" cy="15.5" r="3.4" opacity=".9"/><circle cx="15.5" cy="48" r="2.6" opacity=".65"/></svg></span>拾光</a>
    <nav class="mainnav" id="mainNav" aria-label="主导航">
      <a href="#/home" data-nav="home"><i data-icon="home"></i><span>首页</span></a>
      <a href="#/notes" data-nav="notes"><i data-icon="book"></i><span>手账</span></a>
      <a href="#/calendar" data-nav="calendar"><i data-icon="calendar"></i><span>日历</span></a>
      <a href="#/report" data-nav="report"><i data-icon="chart"></i><span>年度报告</span></a>
      <a href="#/settings" data-nav="settings"><i data-icon="sliders"></i><span>设置</span></a>
    </nav>
    <div class="topbar-actions">
      <button id="btnSearch" class="iconbtn" type="button" aria-label="搜索"><i data-icon="search"></i></button>
      <button id="btnTheme" class="iconbtn" type="button" aria-label="切换深色模式"><i data-icon="moon"></i></button>
      <button id="btnLockNow" class="iconbtn" type="button" aria-label="立即锁定" hidden><i data-icon="lock"></i></button>
    </div>
  </div>
</header>

<main id="view" class="view" aria-live="polite"></main>

<footer class="footer">
  <p>拾光 · 把每一天都好好收藏</p>
  <p class="foot-sub">数据保存在本机 · shiguang/data 与 shiguang/uploads</p>
</footer>

<!-- 锁屏 -->
<div id="lockScreen" class="lockscreen" hidden>
  <div class="lock-card">
    <div class="lock-glyph" aria-hidden="true"><i data-icon="lock"></i></div>
    <h1>拾光已锁定</h1>
    <p class="lock-sub">输入隐私密码，继续查看你的手账</p>
    <input id="lockPass" class="lock-input" type="password" inputmode="numeric" autocomplete="off" placeholder="隐私密码" maxlength="8">
    <button id="btnUnlock" class="btn btn-primary btn-block" type="button">解锁</button>
    <p class="lock-err" id="lockErr" role="alert" hidden>密码不正确，再试试</p>
  </div>
</div>

<!-- 详情浮层（小红书笔记样式） -->
<div id="detailOverlay" class="overlay" hidden>
  <div class="overlay-mask" data-close-detail></div>
  <article class="note-detail" id="noteDetail" role="dialog" aria-modal="true" aria-label="记录详情"></article>
  <button class="overlay-close iconbtn" type="button" data-close-detail aria-label="关闭详情"><i data-icon="x"></i></button>
</div>

<!-- 搜索浮层 -->
<div id="searchOverlay" class="overlay" hidden>
  <div class="overlay-mask" data-close-search></div>
  <div class="search-panel" role="dialog" aria-modal="true" aria-label="搜索">
    <div class="search-bar">
      <i data-icon="search" aria-hidden="true"></i>
      <input id="searchInput" type="search" placeholder="搜索文字、标签……" autocomplete="off">
      <button class="iconbtn" type="button" data-close-search aria-label="关闭搜索"><i data-icon="x"></i></button>
    </div>
    <div class="search-tags" id="searchTags"></div>
    <div class="search-results masonry masonry-sm" id="searchResults" aria-live="polite"></div>
  </div>
</div>

<!-- 通用弹窗 & Toast -->
<div id="modalRoot"></div>
<div id="toast" class="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
